name: Apply current-rule quality audit fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/quality-audit-current-rules-fixes.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted audit fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          notes = []

          abandonment = '若尚未達成正文任何明確結局，視為任務放棄，基礎歷練為 **0**；若離開前已達成正文某一主要／部分結局，直接按該結局結算。'

          def write_if_changed(path, before, after):
              if after != before:
                  Path(path).write_text(after, encoding='utf-8')
                  changed.append(path)
                  return True
              notes.append(f'NO MATCH: {path}')
              return False

          def replace_heading_section(path, heading_keyword):
              p = Path(path); text = p.read_text(encoding='utf-8'); before = text
              # Find a markdown heading containing the keyword and replace its body only.
              m = re.search(rf'(?m)^(#{{2,5}}[^\n]*{re.escape(heading_keyword)}[^\n]*\n)', text)
              if m:
                  level = len(m.group(1)) - len(m.group(1).lstrip('#'))
                  nxt = re.search(rf'(?m)^#{{1,{level}}}\s', text[m.end():])
                  end = m.end() + (nxt.start() if nxt else len(text)-m.end())
                  body = '\n' + abandonment + '\n\n'
                  text = text[:m.end()] + body + text[end:]
              write_if_changed(path, before, text)

          def replace_paragraph_containing(path, keyword):
              p = Path(path); text = p.read_text(encoding='utf-8'); before = text
              pos = text.find(keyword)
              if pos >= 0:
                  start = text.rfind('\n\n', 0, pos)
                  start = 0 if start < 0 else start + 2
                  end = text.find('\n\n', pos)
                  end = len(text) if end < 0 else end
                  text = text[:start] + keyword + '：' + abandonment + text[end:]
              write_if_changed(path, before, text)

          # Old early-exit awards that conflict with the current explicit abandonment rule.
          replace_heading_section('OOTB_劇本_雪線斷碑.md', '提早退出')
          replace_heading_section('OOTB_劇本_鹽鏡焚契.md', '提早退出')
          replace_paragraph_containing('OOTB_劇本_墨雨七榜.md', '只處理第一榜')
          replace_paragraph_containing('OOTB_劇本_萬燈空棺.md', '未進棺場')
          replace_paragraph_containing('OOTB_劇本_潮關無聲.md', '不涉此關')
          replace_paragraph_containing('OOTB_劇本_灰簿照影.md', '只突破封關離境')
          replace_paragraph_containing('OOTB_入門任務_一夜長出的界碑.md', '很早退出')
          replace_paragraph_containing('OOTB_入門任務_井底有人敲三聲.md', '很早退出')

          # Borrowed Three Halls Name: normalize only its explicit withdrawal/early-exit block.
          p = Path('OOTB_劇本_借來的三館名.md'); text = p.read_text(encoding='utf-8'); before = text
          m = re.search(r'(?mi)^#{2,5}[^\n]*(?:提早退出|提前退出|任務放棄|退出)[^\n]*\n', text)
          if m:
              level = len(m.group(0)) - len(m.group(0).lstrip('#'))
              nxt = re.search(rf'(?m)^#{{1,{level}}}\s', text[m.end():])
              end = m.end() + (nxt.start() if nxt else len(text)-m.end())
              text = text[:m.end()] + '\n' + abandonment + '\n\n' + text[end:]
          else:
              # Fallback: replace a paragraph that contains both an exit term and an XP term.
              for para in text.split('\n\n'):
                  if re.search(r'(提早退出|提前退出|退出任務|離開任務)', para) and re.search(r'(歷練|XP|點)', para):
                      text = text.replace(para, '提早退出／任務放棄：' + abandonment, 1)
                      break
          write_if_changed(str(p), before, text)

          # Rainy Missing Bridge Planks: add an explicit worst-case world state.
          p = Path('OOTB_入門任務_雨天不見的橋板.md'); text = p.read_text(encoding='utf-8'); before = text
          if not re.search(r'(?m)^##+\s*最壞結果', text):
              m = re.search(r'(?ms)(##\s*玩家不介入\s*\n.*?)(?=\n---|\n#\s|\n##\s)', text)
              if m:
                  worst = ('\n\n## 最壞結果\n\n'
                           '暴雨再漲時，未封閉或加固的缺板便橋發生翻車事故，至少一名過路人重傷並造成大批貨損；青蠍會趁混亂把「護橋費」坐實成長期勒索，官差其後只追究偷板與鬥毆，木匠一家失去遮雨處，渡口亦因事故被迫停運。這是危機持續失控時的最壞世界狀態，不以單次失敗直接觸發。\n')
                  text = text[:m.start()] + m.group(1).rstrip() + worst + text[m.end():]
          write_if_changed(str(p), before, text)

          # Rain Ferry Without Silver: fix authority path, missing ending-XP line, and handout typo.
          p = Path('OOTB_劇本_雨渡無銀.md'); text = p.read_text(encoding='utf-8'); before = text
          text = text.replace('`GM遊玩規則/README.md`', '`GM規則/README.md`')
          text = text.replace('官銀失失之案', '官銀失竊之案')
          marker = '# 23.4 結局 D：相信假案\n\n'
          if marker in text:
              block = text.split(marker,1)[1].split('# 23.5',1)[0]
              if '**基礎歷練**' not in block:
                  text = text.replace(marker, marker + '**基礎歷練**：江湖 3、計略 2（總計 5）。\n\n', 1)
          write_if_changed(str(p), before, text)

          # This one-shot workflow must not remain in the repository.
          wf = Path('.github/workflows/quality-audit-current-rules-fixes.yml')
          if wf.exists():
              wf.unlink()

          print('CHANGED', len(changed))
          for x in changed: print(' +', x)
          for x in notes: print(' !', x)
          if not changed:
              raise SystemExit('No script fixes matched; refusing empty repair commit')
          PY
          git config user.name 'OOTB Quality Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix quality-audit rule conflicts'
          git push origin HEAD:main
