name: Temporary campaign file rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-campaign-file.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename campaign file and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          old='OOTB_劇本_河倉三封急牒.md'
          new='OOTB_戰役任務_漕河暗牒(1)_河倉三封急牒.md'
          test -f "$old"
          test ! -e "$new"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git mv -- "$old" "$new"
          git rm -- '.github/workflows/rename-campaign-file.yml'
          git commit -m 'Rename campaign mission file'
          git push origin HEAD:main
