name: Temporary repeatable reputation cap repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add explicit repeatable reputation caps
        shell: python
        run: |
          import pathlib, re
          targets={
            'OOTB_可重覆任務_二十步外的箭.md','OOTB_可重覆任務_兩張一樣的貨單.md','OOTB_可重覆任務_橋中央的空車.md',
            'OOTB_可重覆任務_河堤夜火.md','OOTB_可重覆任務_石階無主.md','OOTB_可重覆任務_紙坊水輪停了.md',
            'OOTB_可重覆任務_紙燈沉井.md','OOTB_可重覆任務_茶箱裡沒有茶.md','OOTB_可重覆任務_雨天不見的橋板.md'}
          cap='- 社會名譽：同一角色對本 `script_id` 前 **3 次**正式結算可按該次 ending 取得俠名、惡名及本文列出的正式相對名譽；**第 4 次起，本任務所有社會名譽倍率均視為 0.0x E**。已實際造成的犯罪、懸賞、恩怨、債務或其他非名譽世界後果不因達到此上限而消失。\n'
          for name in targets:
            p=pathlib.Path(name)
            t=p.read_text(encoding='utf-8')
            if cap.strip() in t: continue
            m=re.search(r'(^##\s*1\.6\s*重複獎勵[^\n]*\n)',t,re.M)
            if not m:
              m=re.search(r'(^#{2,3}\s*重複獎勵[^\n]*\n)',t,re.M)
            if m:
              t=t[:m.end()]+cap+t[m.end():]
            else:
              t+='\n## 重複社會名譽上限\n'+cap
            p.write_text(t,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'OOTB_可重覆任務_*.md'
          if ! git diff --cached --quiet; then
            git commit -m 'Add repeatable social reputation caps'
            git push
          fi
