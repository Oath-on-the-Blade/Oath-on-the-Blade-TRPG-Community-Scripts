name: Temporary current-rule script audit repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-current-script-rules.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair scripts
        shell: bash
        run: python3 .github/repair_current_scripts.py

      - name: Commit repaired scripts and remove temporary tools
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-current-script-rules.yml .github/repair_current_scripts.py
          git add OOTB_*.md .github/workflows/repair-current-script-rules.yml .github/repair_current_scripts.py
          git diff --cached --quiet && exit 0
          git commit -m 'Repair scripts for current design rules'
          git push origin HEAD:main
