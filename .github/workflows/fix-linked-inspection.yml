name: Fix linked inspection script
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-linked-inspection.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch script and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('OOTB_任務_山務院少了兩行驗貨記.md')
          s=p.read_text()
          s=s.replace('`內容庫/敵人圖鑑.md`【天嶽劍客】【惡少打手】【走私客／水手】', '`內容庫/敵人圖鑑.md`【惡少打手】【走私客／水手】')
          s=s.replace('力量或魅力（威嚇）DC13可逼他放下車把', '力量（威嚇）DC13 或魅力（威嚇）DC13 可逼他放下車把')
          old='''十五枚錯標軟楔因此進了北坡料棚。其後已有七枚被不同維修班領走：六枚仍可追查到尚未承受主力的木棚、欄索或備件位置；另有一枚去向在領料簿上只寫「外峰索橋備楔」，可能就是《七峰索橋少一枚鐵楔》中那枚舊軟鐵楔，也可能是同批另一枚。**本篇不把兩者寫成必然同一實物**，避免覆寫前作局部事實；只確立它們來自同一批錯誤物料的合理可能性。'''
          new='''十五枚錯標軟楔因此進了北坡料棚。其後已有七枚被不同維修班領走：六枚仍可追查到尚未承受主力的木棚、欄索或備件位置；第七枚在領料簿上只寫「外峰索橋備楔」，但山務院的月末備件回收木牌可進一步確認它被送到西北舊哨棚的封存修橋箱，目前仍未安裝、沒有承力風險。若同一 `game_id` 已玩過《七峰索橋少一枚鐵楔》，本篇**不把前作那枚軟楔追認為本批第七枚**，除非前作存檔本身已明確建立相同來源；前作軟楔只可作材質比對背景，避免覆寫既有局部事實。'''
          assert old in s
          s=s.replace(old,new)
          old2='''第七枚若同一 `game_id` 已完成《七峰索橋少一枚鐵楔》，按該桌保存狀態處理：可能已成證物、已被替換、已遺失或不再可追。若前作未玩過，本篇不要求 GM 指定它在哪；領料簿的模糊記錄本身就是山務流程缺口，召回總數以已確認的六處與庫存實物結算，不能為了湊數臨時生成一座危險索橋。'''
          new2='''第七枚的領料簿雖只寫「外峰索橋備楔」，但查山務院月末備件回收木牌即可直接定位到**西北舊哨棚封存修橋箱**。從六點中任一處繞去舊哨棚額外耗時1小時；封存箱有山務鉛封，持正式口令冊可直接開封，否則須由山務院派員到場。該楔未安裝，不構成當前承力危險，但必須一併召回才算完成全數已知物料控制。若同一 `game_id` 已完成《七峰索橋少一枚鐵楔》，前作那枚軟楔仍完全按其存檔狀態處理；本篇不自動把它改判成本批第七枚。'''
          assert old2 in s
          s=s.replace(old2,new2)
          s=s.replace('**成立**：六處已知領出點均完成停用／召回；', '**成立**：六處已知領出點與西北舊哨棚封存的第七枚均完成停用／召回；')
          s=s.replace('- 完整參與條件：角色至少參與「物料因果」「召回止害」「危機處理」其中一項，且在終局前仍參與；只中途加入者按實際完成 tag 計。', '- 完整參與條件：角色至少參與「物料因果」「召回止害」「危機處理」其中一項，且在終局前仍參與；中途加入／提早離開者只按本人實際參與並完成的 tag 計。')
          s=s.replace('- 物質結果：山務院支付共同報酬60兩，實際取得後共同持有、可分割。', '- 參與條件：參與任何一次召回／停用或取得一項有效調查證據者按本人實際完成 tag 計；未參與任何有效處置者不取得本結局基礎歷練。\n- 物質結果：山務院支付共同報酬60兩，實際取得後共同持有、可分割。')
          s=s.replace('- 物質結果：100兩由 `<NPC#1>` 實際支付給隊伍共同持有、可分割；補做硬鐵楔直接交山務院，不屬 PC 財產。', '- 參與條件：角色須實際參與查明造假、和解談判或危險件召回至少一項；個人只按本人完成的 tag 計。\n- 物質結果：100兩由 `<NPC#1>` 實際支付給隊伍共同持有、可分割；補做硬鐵楔直接交山務院，不屬 PC 財產。')
          s=s.replace('- 物質結果：無固定山務院報酬；非法取得財物按實際持有記錄，不自動合法化。', '- 參與條件：只計角色本人實際參與的調查、召回或危機 tag；公開私刑本身不額外產生歷練。\n- 物質結果：無固定山務院報酬；非法取得財物按實際持有記錄，不自動合法化。')
          s=s.replace('- 物質結果：無固定報酬。\n- 社會名譽：俠名、惡名、【天嶽派】、【河洛道民間】均 `0.0x E`', '- 參與條件：只計放棄前角色本人已實際完成的 tag；沒有完成任何 tag 的角色取得0基礎歷練。\n- 物質結果：無固定報酬。\n- 社會名譽：俠名、惡名、【天嶽派】、【河洛道民間】均 `0.0x E`')
          p.write_text(s)
          PY
          grep -q '西北舊哨棚封存修橋箱' 'OOTB_任務_山務院少了兩行驗貨記.md'
          ! grep -q '【天嶽劍客】' 'OOTB_任務_山務院少了兩行驗貨記.md'
          grep -q '力量（威嚇）DC13 或魅力（威嚇）DC13' 'OOTB_任務_山務院少了兩行驗貨記.md'
          git rm .github/workflows/fix-linked-inspection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'OOTB_任務_山務院少了兩行驗貨記.md'
          git commit -m '修正關聯任務反交付問題'
          git push
