name: Temporary general scripts to tasks migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-general-scripts-to-tasks.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rename general script files and references
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(OOTB_劇本_*.md)
          for old in "${files[@]}"; do
            new="${old/OOTB_劇本_/OOTB_任務_}"
            if [[ -e "$new" ]]; then
              echo "Destination already exists: $new" >&2
              exit 1
            fi
            git mv -- "$old" "$new"
          done
          git grep -Il -z 'OOTB_劇本_' -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp' 2>/dev/null | xargs -0 -r sed -i 's/OOTB_劇本_/OOTB_任務_/g'
          rm -f .github/workflows/rename-general-scripts-to-tasks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rename general scripts as tasks'
          git push origin HEAD:main
