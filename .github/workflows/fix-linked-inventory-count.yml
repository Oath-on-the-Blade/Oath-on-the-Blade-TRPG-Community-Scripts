name: Fix linked inventory count
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-linked-inventory-count.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct inventory arithmetic and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('OOTB_任務_山務院少了兩行驗貨記.md')
          s=p.read_text()
          s=s.replace('趁亂把十二枚剩餘軟楔裝車。', '趁亂把北坡現存八枚軟楔（含三枚抽驗件）裝車。')
          s=s.replace('北坡料棚剩餘十二枚加石泉驛五枚，與二十枚重打數量相差三枚；再扣除抽驗時已拆驗的三枚，數量能閉合至七枚領出。', '北坡料棚現存八枚（其中三枚已抽驗）加石泉驛五枚，共十三枚；與二十枚重打總數相差七枚，恰與領料簿的七枚領出紀錄閉合。')
          s=s.replace('T+4 小時：若未受阻，十二枚剩餘軟楔被裝車帶走', 'T+4 小時：若未受阻，北坡現存八枚軟楔被裝車帶走')
          s=s.replace('他先出示取貨條，聲稱「掌櫃發現送錯舊農具料，要原箱取回」。', '他先出示取貨條，聲稱「掌櫃發現送錯舊農具料，要原箱取回」。他要取走的是北坡現存八枚軟楔，包括收貨房桌上的三枚抽驗件。')
          s=s.replace('若 PC 未提前控制工票，黃昏時', '若 PC 未提前控制工票，黃昏時')
          # Add fame downside after high-fame convenience.
          old='- 高名氣角色更容易被班組認出而快速取得注意，但若惡名偏高，普通山民會要求山務門人在場才交設備。'
          new='- 高名氣角色更容易被班組認出而快速取得注意，但身份也更難隱藏：一旦 PC 在任一班組公開身分，消息會沿山務傳話送回石泉驛；若 `<NPC#4>` 尚未行動，他之後的下一個危機節點提前30分鐘。若惡名偏高，普通山民另會要求山務門人在場才交設備。'
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
          grep -q '北坡現存八枚' 'OOTB_任務_山務院少了兩行驗貨記.md'
          ! grep -q '十二枚剩餘軟楔' 'OOTB_任務_山務院少了兩行驗貨記.md'
          git rm .github/workflows/fix-linked-inventory-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'OOTB_任務_山務院少了兩行驗貨記.md'
          git commit -m '修正關聯任務庫存閉環'
          git push
