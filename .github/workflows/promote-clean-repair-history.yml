name: Temporary verified clean-history promoter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-current-rules-clean-final
          fetch-depth: 0
      - name: Verify 49 clean commits and promote to main
        shell: bash
        run: |
          set -euo pipefail
          BASE=74998356b3655d808658883d7a8f8e5367a706e3
          git fetch origin final-content-current-rules:refs/remotes/origin/final-content-current-rules
          count=$(git rev-list --count "$BASE"..HEAD)
          if [ "$count" -ne 49 ]; then
            echo "expected 49 commits, got $count"
            exit 1
          fi
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD)
          if [ "${#files[@]}" -ne 49 ]; then
            echo "expected 49 changed files, got ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$f" in OOTB_*.md) ;; *) echo "unexpected changed file: $f"; exit 1;; esac
          done
          per_commit=0
          while read -r c; do
            mapfile -t names < <(git diff-tree --no-commit-id --name-only -r "$c")
            if [ "${#names[@]}" -ne 1 ]; then
              echo "commit $c changes ${#names[@]} files"
              exit 1
            fi
            case "${names[0]}" in OOTB_*.md) ;; *) echo "commit $c changes non-script ${names[0]}"; exit 1;; esac
            per_commit=$((per_commit+1))
          done < <(git rev-list --reverse "$BASE"..HEAD)
          if [ "$per_commit" -ne 49 ]; then
            echo "per-commit verification count $per_commit"
            exit 1
          fi
          if ! git diff --quiet HEAD refs/remotes/origin/final-content-current-rules -- 'OOTB_*.md'; then
            echo "clean history content differs from audited final snapshot"
            git diff --name-only HEAD refs/remotes/origin/final-content-current-rules -- 'OOTB_*.md'
            exit 1
          fi
          echo "VERIFY_OK commits=49 files=49 per_commit=49 content_matches_audited_snapshot"
          git push --force origin HEAD:main
