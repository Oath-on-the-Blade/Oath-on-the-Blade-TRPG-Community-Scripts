name: Temporary midnight audit repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-midnight-audit-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply current handbook audit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
            'baixi': Path('OOTB_任務_百戲棚下無人鼓.md'),
            'qianji': Path('OOTB_任務_千機峽外兩道弩痕.md'),
            'guzhou': Path('OOTB_任務_孤舟不泊舊渡口.md'),
            'chaojing': Path('OOTB_任務_潮井三次空桶.md'),
            'shuanghua': Path('OOTB_任務_霜華閣外一盞暖燈.md'),
            'yanwei': Path('OOTB_任務_燕尾鏢落在空碗裡.md'),
            'sifang': Path('OOTB_任務_四坊封門前.md'),
          }

          def must_replace(t, old, new, label):
              if old not in t:
                  raise SystemExit(f'missing expected text for {label}: {old[:100]}')
              return t.replace(old, new)

          def replace_social_after_id(t, ending_id, line):
              p = t.find(f'`ending_id`: `{ending_id}`')
              if p < 0:
                  raise SystemExit(f'missing ending {ending_id}')
              n = t.find('\n## END-', p + 1)
              if n < 0: n = len(t)
              s = t.find('- 社會名譽：', p, n)
              if s < 0:
                  raise SystemExit(f'missing social line for {ending_id}')
              e = t.find('\n', s)
              if e < 0: e = len(t)
              return t[:s] + line + t[e:]

          def insert_prep(t, prep):
              marker = '\n---\n\n# 1.'
              if '# 0. 出發前整備' in t or '# 2. 出發前整備' in t:
                  raise SystemExit('prep already exists unexpectedly')
              if marker not in t:
                  raise SystemExit('cannot locate first section marker')
              return t.replace(marker, '\n---\n\n' + prep.strip() + '\n\n---\n\n# 1.', 1)

          path_map = {
            '`遊玩規則/00_遊戲核心.md`':'`遊玩規則/核心/遊戲核心.md`',
            '`遊玩規則/02_拿手與非戰鬥.md`':'`遊玩規則/核心/拿手與非戰鬥.md`',
            '`遊玩規則/03_戰鬥.md`':'`遊玩規則/遊玩流程/戰鬥.md`',
            '`遊玩規則/05_外功.md`':'`遊玩規則/系統與機制/外功.md`',
            '`遊玩規則/08_輕功.md`':'`遊玩規則/系統與機制/輕功.md`',
            '`遊玩規則/09_絕活名望與門派.md`':'`遊玩規則/角色/社會名譽與門派.md`',
            '`遊玩規則/10_升級探索與NPC.md`':'`遊玩規則/角色/升級與武學成長.md`',
          }

          prep_baixi = '''# 0. 出發前整備

- **整備類型**：突發。
- **安全空檔**：0 小時（0 個 30 分鐘空檔回合）。主鼓失聲與主索裂開已同時發生，不能在危機開始後回溯宣告曾購物、取物、製作、補水或休息。
- **開始位置**：照水鎮南市百戲棚內外的觀眾區／入口附近；角色必須使用開場當下實際隨身裝備。
- **玩家可知資訊**：數百觀眾已入場，棚架正發出異常木裂聲，西南角明顯失穩；這是當場可見的人命危機，不需要先知道勒索案真相才能選擇救援裝備或路線。
- **補給與食水**：事件預計在當日數小時內收束，不跨日遠行；不額外扣日常食水。若角色之後離場購物／回住處取物，必須按實際往返時間推進危機時鐘。
- **場景既有資源**：大棚原有滑輪、木撐、戲班長竿與工作繩索屬場景資源；取得／使用位置依場景描述，不因此視為角色事前已持有，也不在結局自動成為玩家財產。
- **出發交接**：危機開始前只做一次現況確認：逐名記錄攜帶格上限、實際隨身物、坐騎／載具載物與留存位置，且已用格不得超上限。角色擁有但不在身上的物品仍留在原存放處。
- **規則依據**：`遊玩規則/遊玩流程/整備與安全空檔.md`、`遊玩規則/系統與機制/裝備基礎.md`。'''

          prep_qianji = '''# 0. 出發前整備

- **整備類型**：突發。
- **安全空檔**：0 小時（0 個 30 分鐘空檔回合）。第二架弩剛送到責器亭，第三架已在半個時辰前往試索坡，不能先花時間回山門／驛站完整整備再讓危機停住等人。
- **開始位置**：千機峽外責器亭；角色只可使用當下實際隨身裝備。
- **玩家可知資訊**：兩架同型弩已造成傷人／走火，第三架正被送去守夜；試索坡同日稍後有驛隊經過。玩家不需先知道偷換與改造真相，便能判斷排危、追車、封存證物可能需要的手段。
- **補給與食水**：行動範圍都在責器亭、試索坡、舊水車道、石梁驛之間，預計當日收束，不跨日遠行；沒有免費新增食水、工具或彈藥。若離場購買／取物，按實際時間推進危機。
- **場景既有資源**：責器亭的封存繩、木楔、拆驗工具及事故弩均是門派／案場資源；是否可使用依 NPC 與場景權限處理，不算角色事前攜帶，也不因使用而取得所有權。
- **出發交接**：逐名固定攜帶格上限、實際隨身物、坐騎／載具載物與留存位置；已用格不得超上限。0 小時開場不得回溯生成未持有裝備。
- **規則依據**：`遊玩規則/遊玩流程/整備與安全空檔.md`、`遊玩規則/系統與機制/裝備基礎.md`。'''

          prep_guzhou = '''# 0. 出發前整備

- **整備類型**：突發。
- **安全空檔**：0 小時（0 個 30 分鐘空檔回合）。渡舟已帶著兩名留守者漂向急彎，不能先回鎮購物、製作或休息後再開始救援。
- **開始位置**：白蘆河舊渡口岸邊；角色只可使用開場當下實際隨身裝備。
- **玩家可知資訊**：河水暴漲、渡舟離樁、兩名留守者仍在船上，斷纜洲急彎就在下游；岸上亦公開存在日落前的泊位爭議。這些資訊足以讓玩家決定先救人、分隊或追查，而不劇透解纜真相。
- **補給與食水**：本任務預計在同一日內沿白蘆河收束，不需野外跨日補給。若角色之後離場取物或採買，按實際往返時間推進危機。
- **場景既有資源**：渡戶可立即提供一艘小划子、兩組【麻繩50尺】、普通長篙與岸樁作救命場景資源；它們屬渡戶，不視為角色事前持有，任務後亦不自動轉為玩家財產。
- **出發交接**：逐名固定攜帶格上限、實際隨身物、坐騎／載具載物與留存位置；已用格不得超上限。角色擁有但留在別處的物品，必須實際花時間回取。
- **規則依據**：`遊玩規則/遊玩流程/整備與安全空檔.md`、`遊玩規則/系統與機制/裝備基礎.md`。'''

          prep_chaojing = '''# 0. 出發前整備

- **整備類型**：突發。
- **安全空檔**：0 小時（0 個 30 分鐘空檔回合）。開場時井下已有人敲擊求救且潮位正在回升，不能回溯宣告曾先買繩、取工具、製作或休息。
- **開始位置**：潮井鎮石井街中央井附近；角色只可使用當下實際隨身裝備。
- **玩家可知資訊**：三井同時失水、居民正爭存水、井底有明確求救聲；潮井鎮位於沿海，居民知道潮位仍會變動。這些公開資訊足以讓玩家判斷救援與控水的即時性，不揭露誰重開舊渠。
- **補給與食水**：事件預計數小時內收束，不跨日遠行；鎮內雖有日常店舖，0 小時開場不自動視為已購物。之後若離場採買／取物，按實際時間推進危機。
- **場景既有資源**：中央井旁公用井具存有一組【麻繩50尺】與一組【抓鉤繩】，供鎮民維修／救援；屬鎮上場景資源，不算角色事前攜帶，使用後仍歸鎮上。
- **出發交接**：逐名固定攜帶格上限、實際隨身物、坐騎／載具載物與留存位置；已用格不得超上限。角色擁有但不在身上的物品不因危機需要而免費出現。
- **規則依據**：`遊玩規則/遊玩流程/整備與安全空檔.md`、`遊玩規則/系統與機制/裝備基礎.md`。'''

          prep_shuanghua = '''# 0. 出發前整備

- **整備類型**：突發。
- **安全空檔**：0 小時（0 個 30 分鐘空檔回合）。兩艘夜渡舟已在薄冰區遇險，不能先返回山門／村落購物、製作、補水或休息後再開始救援。
- **開始位置**：寒汀湖暖燈渡岸邊；角色只可使用開場當下實際隨身裝備。
- **玩家可知資訊**：湖面是黑水與薄冰交錯而非整湖封凍，一盞安全暖燈出現在錯位的北蘆汀，前舟已側傾、後舟仍在漂近。這些都是開場可見資訊，不提前揭露移燈與湖藥真相。
- **補給與食水**：本任務預計在同一冬夜內收束，不跨日遠行；保暖與救援器材若非角色實際攜帶，須取自明列場景來源。之後離場取物會按實際時間推進危機。
- **場景既有資源**：霜華巡湖／渡口備有救命用長繩、舟板、長篙與保暖毯；是否能自由取用及證物封存權限依第7節 NPC／名譽反應處理。這些是場景資源，不自動寫入角色所有物。
- **出發交接**：逐名固定攜帶格上限、實際隨身物、坐騎／載具載物與留存位置；已用格不得超上限。0 小時開場不得追溯新增裝備。
- **規則依據**：`遊玩規則/遊玩流程/整備與安全空檔.md`、`遊玩規則/系統與機制/裝備基礎.md`。'''

          prep_yanwei = '''# 0. 出發前整備

- **整備類型**：突發。
- **安全空檔**：0 小時（0 個 30 分鐘空檔回合）。燕尾鏢落碗後，<NPC#2>已被武人追趕；不能先回住處／市集購物、製作、補給或休息，再讓追逐與滅證行動停住。
- **開始位置**：洛安外城三碗市茶棚附近；角色只可使用開場當下實際隨身裝備。
- **玩家可知資訊**：一枚鏢故意落入空碗而未傷人、<NPC#3>立刻喊抓人、<NPC#2>持泛黃紙據遭追；南門驗契亭當日仍會關門。玩家不需先知道十二年前真相便能判斷護證／追逐是即時行動。
- **補給與食水**：本任務在洛安外城市場內數小時收束，不跨日遠行；市場有商販不代表角色已經買到任何物品。若危機開始後停下購買／取物，按實際耗時推進危機。
- **場景既有資源**：茶棚桌凳、布棚、瓦市晾竹橋等只按場景實際存在使用；缺口燕尾鏢與紙據是證物，不因玩家接觸而成為任務獎勵。
- **出發交接**：逐名固定攜帶格上限、實際隨身物、坐騎／載具載物與留存位置；已用格不得超上限。角色擁有但不在身上的物品必須實際回取。
- **規則依據**：`遊玩規則/遊玩流程/整備與安全空檔.md`、`遊玩規則/系統與機制/裝備基礎.md`。'''

          # 百戲
          p=files['baixi']; t=p.read_text()
          t=must_replace(t,'| 劇本版本 | 1.0 |','| 劇本版本 | 1.1 |','baixi version')
          for a,b in path_map.items(): t=t.replace(a,b)
          t=t.replace('【民間】','【江南道民間】').replace('【商賈】','【江南道民間】').replace('【官府】','【江南道官府】')
          t=t.replace('【江南道民間】【江南道民間】','【江南道民間】')
          t=t.replace('正式相對名譽對象只使用【江南道民間】【江南道官府】。','正式相對名譽對象只使用【江南道民間】【江南道官府】；南市普通商戶沒有另設商業泛類數值，按地域民間或私人關係處理。')
          t=t.replace('本任務使用正式對象【江南道民間】【江南道官府】。','本任務使用正式對象【江南道民間】【江南道官府】。南市普通商戶與行會在沒有正式登錄母勢力時，不另建立相對名譽數值；其態度屬【江南道民間】或本事件私人關係。')
          t=replace_social_after_id(t,'baixi-end-01-safe-and-proven','- 社會名譽：俠名+0.6x E；惡名+0.0x E；【江南道民間】+0.5x E；【江南道官府】+0.2x E。傳播：觀眾、戲班與南市商戶共同見證救援與保棚，形成江南道民間評價；捕快收證與立案記錄形成江南道官府評價。')
          t=replace_social_after_id(t,'baixi-end-02-shed-lost-people-saved','- 社會名譽：俠名+0.4x E；惡名+0.0x E；【江南道民間】+0.4x E；【江南道官府】+0.2x E。傳播：大批觀眾與南市商戶見證人員安全撤離；捕快依交證記錄玩家協助追責。')
          t=replace_social_after_id(t,'baixi-end-03-one-side-only','- 社會名譽：救援成功且公開時俠名+0.2x E、惡名0、【江南道民間】+0.2x E；若玩家明知危機仍延誤造成傷亡，俠名0、惡名0、【江南道民間】-0.2x E；【江南道官府】0。傳播只來自在場觀眾、戲班與南市商戶對實際救援／延誤的見證。')
          t=replace_social_after_id(t,'baixi-end-04-truth-sinks','- 社會名譽：若有公開救援，俠名+0.2x E、惡名0、【江南道民間】+0.2x E；否則俠名0、惡名0、【江南道民間】0；【江南道官府】0。傳播僅由被救觀眾、戲班與南市商戶形成，不因秘密查案自動增加名譽。')
          t=replace_social_after_id(t,'baixi-end-05-abandoned-collapse','- 社會名譽：一般離場俠名0、惡名0、【江南道民間】0、【江南道官府】0。若公開承諾救援後臨陣離開且被大量觀眾見證，【江南道民間】-0.2x E；若公開主動製造踩踏或殺害投降者，惡名依實際可傳播行為取+0.3x E至+0.6x E的一項，不疊加。傳播由在場觀眾、戲班與後續傷者口述形成。')
          t=insert_prep(t,prep_baixi); p.write_text(t)

          # 千機
          p=files['qianji']; t=p.read_text()
          t=must_replace(t,'| 劇本版本 | 1.0 |','| 劇本版本 | 1.1 |','qianji version')
          for a,b in path_map.items(): t=t.replace(a,b)
          t=t.replace('【民間】','【雲西道民間】').replace('【商賈】','【雲西道民間】').replace('【官府】','【雲西道官府】')
          t=t.replace('【雲西道民間】【雲西道民間】','【雲西道民間】')
          t=t.replace('正式相對名譽使用【天機閣】【雲西道民間】','正式相對名譽使用【天機閣】【雲西道民間】；普通驛貨商的私人商業評價不另建立泛類數值')
          t=replace_social_after_id(t,'qianji-end-01-tools-and-responsibility','- 社會名譽：俠名+0.5x E；惡名0；【天機閣】+0.5x E；【雲西道民間】+0.4x E。傳播：天機門人把角色拒絕滅證且排危的事蹟回報山門；傷者、驛戶與往來商旅在雲西道民間傳播玩家既追責又沒有藉機搶貨的評價。')
          t=replace_social_after_id(t,'qianji-end-02-danger-stopped-case-open','- 社會名譽：俠名+0.4x E；惡名0；【天機閣】+0.2x E；【雲西道民間】+0.3x E。傳播：驛隊與傷者見證排危；天機門人知道玩家保住證物但案情未全，故門派正評較低。')
          t=replace_social_after_id(t,'qianji-end-03-one-side-protected','- 社會名譽：偏袒門派滅證時俠名0、惡名0、【天機閣】+0.1x E、【雲西道民間】-0.3x E；故意毀門派證物替商方卸責時俠名0、惡名0、【天機閣】-0.3x E、【雲西道民間】0。前者由受傷者與驛戶見證壓證而形成地域負評；後者只形成具體商方私人感謝，不建立泛商業名譽。秘密未曝光的偏袒不產生全江湖俠名／惡名。沒有引薦。')
