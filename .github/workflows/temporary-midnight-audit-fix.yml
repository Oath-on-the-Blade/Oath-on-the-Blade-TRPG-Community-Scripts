name: Temporary midnight audit repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-midnight-audit-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair audited tasks
        run: python .github/scripts/midnight_audit_fix.py
      - name: Commit repaired tasks and clean temporary files
        run: |
          git config user.name "OOTB Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add OOTB_任務_*.md
          git rm .github/workflows/temporary-midnight-audit-fix.yml .github/scripts/midnight_audit_fix.py
          git commit -m "Audit recent tasks against current handbook"
          git push
