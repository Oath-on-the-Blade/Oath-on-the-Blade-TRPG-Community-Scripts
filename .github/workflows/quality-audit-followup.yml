name: Apply quality audit follow-up

on:
  push:
    branches: [main]
    paths: ['.github/workflows/quality-audit-followup.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove residual abandonment conflicts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('OOTB_入門任務_井底有人敲三聲.md')
          text = p.read_text(encoding='utf-8')
          old = '未實質調查、未面對主要危機便離開，依實際經歷給0--1點。\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected 井底 early-exit sentence count')
          p.write_text(text.replace(old, ''), encoding='utf-8')

          p = Path('OOTB_劇本_潮關無聲.md')
          text = p.read_text(encoding='utf-8')
          start = text.find('不涉此關：若尚未達成正文任何明確結局')
          marker = '\n# 16. 公開證據與官軍動搖機制'
          end = text.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit('could not locate 潮關無聲 old exit block')
          lines = [
              '## 15.5 提早退出／任務放棄',
              '',
              '若玩家在尚未達成正文任一明確結局的成立條件前，經越界警告後確認不再處理核心事件，則進入任務放棄結局。',
              '',
              '- **世界後果**：從目前危機狀態起依「若玩家完全不介入」繼續；已造成的具體後果不倒帶。',
              '- **銀兩／物質**：尚未完成條件的報酬與加成為 0；已合理取得且沒有被追回理由的物件照常保留。',
              '- **基礎歷練**：0。',
              '- **若離開前已達成正文某一主要／部分結局的成立條件**：直接按該結局結算，不再視為任務放棄。',
              '',
              '---',
              ''
          ]
          replacement = '\n'.join(lines)
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          Path('.github/workflows/quality-audit-followup.yml').unlink()
          PY
          git config user.name 'OOTB Quality Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finish quality-audit abandonment fixes'
          git push origin HEAD:main
