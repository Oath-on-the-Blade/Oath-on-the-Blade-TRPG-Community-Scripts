name: Finalize 四坊封門前 v2
on:
  push:
    paths:
      - '.github/workflows/finalize-sifang-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final corrections
        shell: python
        run: |
          from pathlib import Path
          p = Path('OOTB_任務_四坊封門前.md')
          s = p.read_text()
          for a,b in {
            '遊玩規則/00_遊戲核心.md':'遊玩規則/核心/遊戲核心.md',
            '遊玩規則/02_拿手與非戰鬥.md':'遊玩規則/核心/拿手與非戰鬥.md',
            '遊玩規則/03_戰鬥.md':'遊玩規則/遊玩流程/戰鬥.md',
            '遊玩規則/08_輕功.md':'遊玩規則/系統與機制/輕功.md',
          }.items():
              s = s.replace(a,b)
          s = s.replace('；若實際傷亡不是玩家可合理避免（例如玩家已建立通道而第三方突然縱火），GM 將【江南道民間】改為 `0.0x E`，不把不可控後果當道德扣分。', '。')
          s = s.replace('；若玩家其實公開反對錯抓且有見證，對【江南道民間】改為 `0.0x E`。', '。')
          bad = ['遊玩規則/00_遊戲核心.md','遊玩規則/02_拿手與非戰鬥.md','遊玩規則/03_戰鬥.md','遊玩規則/08_輕功.md','改為 `0.0x E`']
          for x in bad:
              if x in s: raise SystemExit(f'remains: {x}')
          p.write_text(s)
      - name: Commit and clean temporary workflows
        run: |
          git config user.name "OOTB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add OOTB_任務_四坊封門前.md
          git rm -f .github/workflows/fix-sifang-final.yml .github/workflows/finalize-sifang-v2.yml
          git commit -m "Finalize 四坊封門前 against current handbook"
          git push
