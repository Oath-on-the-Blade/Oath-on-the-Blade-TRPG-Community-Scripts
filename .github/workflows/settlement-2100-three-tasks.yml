name: Temporary settlement validation for three tasks
on:
  push:
    paths:
      - '.github/workflows/settlement-2100-three-tasks.yml'
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old}')
              p.write_text(s.replace(old,new,1))
          g='OOTB_任務_百戲棚下無人鼓.md'
          rep(g,'- 部分參與：只參與其中一側者得其實際完成tag，最低2、最高5。','- 部分參與：只參與主要救援／穩棚者行旅3；只參與主要查證者計略3；只在終局到場協助交證／和解者江湖1。彼此不疊成完整8點，只有符合完整參與條件才取得完整結局歷練。')
          rep(g,'- 銀兩／物質：全隊120–160兩**實際取得**，以班主當下支付能力決定固定總額後交全隊共同所有、可分割，由玩家共同分配；未付部分不形成自動應收。','- 銀兩／物質：若救援成功但責任未明，全隊160兩**實際取得**；若查案成功但因延誤造成多人重傷，全隊120兩**實際取得**。支付後歸全隊共同所有、可分割，由玩家共同分配；其餘報酬未取得。')
          rep(g,'- 銀兩／物質：全隊80–140兩**實際取得**，只計已完成救援；確定總額後歸全隊共同所有、可分割，由玩家共同分配。已毀證物維持毀損，不生成替代財產。','- 銀兩／物質：若觀眾已完成主要疏散且無死亡，全隊140兩**實際取得**；若只有局部救援，全隊80兩**實際取得**。支付後共同所有、可分割，由玩家共同分配。已毀證物維持毀損，不生成替代財產。')
          rep(g,'- 銀兩／物質：0–60兩；只有已明確完成的個別救援承諾為**實際取得**，付款後屬獲得者；其餘報酬未取得。','- 銀兩／物質：若離場前已完成至少一項明列的個別救援承諾，該角色／小組合計60兩**實際取得**，由完成者共同所有並自行分配；否則0兩。其餘報酬未取得。')
          f='OOTB_任務_千機峽外兩道弩痕.md'
          rep(f,'- 部分參與：按實際tag計，2–5點。','- 部分參與：只參與第三架排危者行旅2；只參與主要責任查明者計略3；只在終局協助交接者江湖1。只有符合完整參與條件才取得完整6點。')
          rep(f,'- 銀兩／物質：80–120兩**實際取得**，由實際受益一方支付；確定總額後歸全隊共同所有、可分割，玩家共同分配；弩仍非玩家財產。','- 銀兩／物質：若第三架已安全排除，全隊120兩**實際取得**；若第三架未排除但玩家完成局部查證，全隊80兩**實際取得**。由實際受益一方支付後歸全隊共同所有、可分割，玩家共同分配；弩仍非玩家財產。')
          rep(f,'- 銀兩／物質：60–100兩**實際取得**，只按排危／救援支付；總額確定後共同所有、可分割，由玩家共同分配。失去的器械／文書維持失落或毀損。','- 銀兩／物質：若第三架已安全排除，全隊100兩**實際取得**；否則若只完成局部救援／排危，全隊60兩**實際取得**。支付後共同所有、可分割，由玩家共同分配。失去的器械／文書維持失落或毀損。')
          rep(f,'- 銀兩／物質：0–60兩；只有已完成救援／排危承諾部分為**實際取得**，其餘未取得；弩仍非玩家財產。','- 銀兩／物質：若放棄前已完成至少一項明列排危／救援，相關委託方支付全隊60兩**實際取得**；否則0兩。其餘報酬未取得；弩仍非玩家財產。')
          m='OOTB_任務_孤舟不泊舊渡口.md'
          rep(m,'- 部分參與：按實際tag，2–4點。','- 部分參與：只參與主要河面救援者行旅3；只參與主要查證者計略2；只在終局協助合法收束者江湖1。只有符合完整參與條件才取得完整6點。')
          rep(m,'- 銀兩／物質：全隊130–170兩**實際取得**，依有無合法協商委託於結局時確定總額；共同所有、可分割，由玩家共同分配。泊位若出售／租用，權利依法轉給交易相對人，玩家不因調停取得所有權。','- 銀兩／物質：若玩家在本任務中另有明確合法協商委託，全隊170兩**實際取得**；否則全隊130兩**實際取得**。共同所有、可分割，由玩家共同分配。泊位若出售／租用，權利依法轉給交易相對人，玩家不因調停取得所有權。')
          rep(m,'- 銀兩／物質：60–100兩**實際取得**，只按救援支付；共同所有、可分割，由玩家共同分配。毀損契紙／手抄本維持毀損，不生成替代財產。','- 銀兩／物質：若兩名留守者均獲救，全隊100兩**實際取得**；若只完成局部救援，全隊60兩**實際取得**。共同所有、可分割，由玩家共同分配。毀損契紙／手抄本維持毀損，不生成替代財產。')
          rep(m,'- 銀兩／物質：0–50兩；只有已完成的個別救援承諾為**實際取得**，其餘報酬未取得。渡舟／泊位不屬玩家。','- 銀兩／物質：若放棄前已完成至少一項局部救援，完成者合計50兩**實際取得**並共同分配；否則0兩。其餘報酬未取得；渡舟／泊位不屬玩家。')
      - run: |
          git config user.name 'OOTB Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add OOTB_任務_百戲棚下無人鼓.md OOTB_任務_千機峽外兩道弩痕.md OOTB_任務_孤舟不泊舊渡口.md
          git commit -m 'Make partial participation and material settlements deterministic'
          git push
