name: Temporary OOTB quality audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair deterministic current-rule migration issues
        shell: python
        run: |
          import re, pathlib, hashlib
          files=sorted(pathlib.Path('.').glob('OOTB_*.md'))
          formal={'體能','身法','巧手','隱密','儒學','道學','佛學','信仰','歷史政治','天文地理','格物推理','醫毒藥理','識字','書畫','棋藝','馴獸','洞察','生存','感應','說服','欺瞞','威嚇','表演','奏樂','騎術'}
          legacy={'文書','調查','追蹤','追跡','察覺','觀察','交涉','醫毒','醫藥','格物','機關','工藝','工程','鍛造','木工','石工','手藝','帳務','航海','航運','水路','軍旅','礦物','農務','刀具','外功','武學'}
          def slug(p):
            stem=p.stem
            return 'ootb-legacy-'+hashlib.sha1(stem.encode()).hexdigest()[:12]
          def pick_skill(line, token):
            if token in {'追蹤','追跡'}: return '直覺（生存）'
            if token in {'察覺','觀察'}: return '直覺（感應）'
            if token=='交涉': return '魅力（說服）'
            if token in {'醫毒','醫藥'}: return '智力（醫毒藥理）'
            if token in {'航海','航運','水路'}: return '智力（天文地理）'
            if token=='文書' or token=='帳務': return '智力（識字）'
            if token=='調查':
              if re.search(r'帳|簿|冊|頁|文|字|契|名冊|記錄|流水|保結|訂單|副本',line): return '智力（識字）'
              if re.search(r'腳印|車轍|足跡|路線|附著物',line): return '直覺（生存）'
              if re.search(r'找|搜尋|注意|藏|床下|工具|異常磚',line): return '直覺（感應）'
              return '智力（格物推理）'
            if token=='機關':
              if re.search(r'操作|重裝|閉閘|鎖閘|拆|開鎖|棘爪|曲柄',line): return '敏捷（巧手）'
              return '智力（格物推理）'
            if token in {'軍旅','農務','刀具'}: return '直覺（生存）'
            if token in {'工藝','工程','鍛造','木工','石工','手藝','礦物','格物','外功','武學'}: return '智力（格物推理）'
            return '智力（格物推理）'
          for p in files:
            t=p.read_text(encoding='utf-8')
            original=t
            # Metadata migration for legacy files. Insert after spec-header heading when present, otherwise after title.
            missing=[]
            if 'script_id' not in t: missing.append(f'- **script_id**：`{slug(p)}`')
            if '劇本版本' not in t: missing.append('- **劇本版本**：1.1')
            if 'replay_policy' not in t:
              if p.name.startswith('OOTB_可重覆任務_'): missing.append('- **replay_policy**：`repeatable`')
              else: missing.append('- **replay_policy**：`once_per_character`')
            if '連續性' not in t:
              missing.append('- **連續性**：`independent`')
            if missing:
              block='\n'.join(missing)+'\n'
              m=re.search(r'(^##\s*劇本規格頭[^\n]*\n)',t,re.M)
              if m:
                t=t[:m.end()]+block+t[m.end():]
              else:
                lines=t.splitlines(True)
                idx=1 if lines and lines[0].startswith('#') else 0
                lines.insert(idx,'\n## 劇本規格頭\n'+block)
                t=''.join(lines)
            # Replace legacy skill labels only when mechanically adjacent to DC/檢定/判定/對抗.
            lines=t.splitlines()
            new=[]
            for line in lines:
              # Slash groups ending in a legacy token + DC: normalize each legacy member to a formal alternative, dedupe.
              # First direct standalone/name before DC.
              for tok in sorted(legacy,key=len,reverse=True):
                # token directly before DC
                line=re.sub(rf'(?<![\w）】]){re.escape(tok)}\s*DC\s*(\d+(?:[–-]\d+)?)', lambda m: pick_skill(line,tok)+' DC'+m.group(1), line)
                # token followed by 檢定/判定/對抗
                line=re.sub(rf'(?<![\w）】]){re.escape(tok)}\s*(檢定|判定|對抗)', lambda m: pick_skill(line,tok)+' '+m.group(1), line)
              # Normalize common ability/legacy slash constructions that survive because DC came after group.
              # Build slash-separated token run before DC and map legacy terms, keeping already-formal words.
              pat=re.compile(r'(?P<grp>(?:[\u4e00-\u9fff]+(?:（[\u4e00-\u9fff]+）)?)(?:／[\u4e00-\u9fff]+(?:（[\u4e00-\u9fff]+）)?)+)\s*DC\s*(?P<dc>\d+(?:[–-]\d+)?)')
              def repl(m):
                parts=m.group('grp').split('／')
                mapped=[]
                for part in parts:
                  if part in legacy: val=pick_skill(line,part)
                  elif part in {'力量'}: val='力量（體能）'
                  elif part in {'敏捷'}: val='敏捷（巧手）'
                  elif part in {'智力'}: val='智力（格物推理）'
                  elif part in {'直覺'}: val='直覺（感應）'
                  elif part in {'魅力'}: val='魅力（說服）'
                  elif part in formal: val=part
                  else: val=part
                  if val not in mapped: mapped.append(val)
                return '或'.join(mapped)+' DC'+m.group('dc')
              line=pat.sub(repl,line)
              new.append(line)
            t='\n'.join(new)+'\n'
            # One clearly invalid reputation migration: distinguish corruption ending in 一夜長出的界碑.
            if p.name=='OOTB_初期任務_一夜長出的界碑.md':
              # Section-scoped changes only.
              def edit_section(text, heading, next_heading, settlement, causal):
                a=text.find(heading)
                if a<0: return text
                b=text.find(next_heading,a+len(heading)) if next_heading else len(text)
                if b<0: b=len(text)
                sec=text[a:b]
                sec=re.sub(r'\*\*社會名譽結算\*\*：[^\n]+', '**社會名譽結算**：'+settlement, sec, count=1)
                sec=re.sub(r'\*\*傳播／因果\*\*：[^\n]+', '**傳播／因果**：'+causal, sec, count=1)
                return text[:a]+sec+text[b:]
              t=edit_section(t,'## 結局二：真相大白，但桑林見血','## 結局三：','俠名 +0.1x E；惡名 +0.0x E；相對名譽【商賈】 +0.0x E；相對名譽【官府】 +0.1x E。','真相公開且可歸因於角色時，仍可因查明詐局取得少量俠名；若流血主要由角色煽動或過度暴力造成，俠名改為 0.0x E。官府只在案件與角色查證結果進入正式紀錄時取得少量正面相對名譽；商賈不因流血本身取得正面變化。')
              t=edit_section(t,'## 結局三：牙行退錢，真相私了','## 結局四：','俠名 +0.0x E；惡名 +0.0x E；相對名譽【商賈】 +0.1x E；相對名譽【官府】 +0.0x E。','此結局以私下撤局收束，沒有足夠公開傳播便不形成俠名／惡名或官府相對名譽；只有牙行、市場中直接知情且把角色視為能迫使同行止損者，才使【商賈】小幅上升。')
              t=edit_section(t,'## 結局四：替假碑作證','---\n\n# 銀兩','俠名 +0.0x E；惡名 +0.3x E；相對名譽【商賈】 -0.2x E；相對名譽【官府】 -0.3x E。','只有假碑案曝光且可靠證人、契書或縣衙紀錄能把角色的明知協力歸到本人時才結算；未曝光前上述倍率均暫為 0.0x E。曝光後，收銀替詐局作證形成惡名；合法商賈把此視為破壞交易信用，官府把此視為協助偽證與詐取，因此相對名譽下降。')
            if t!=original:
              p.write_text(t,encoding='utf-8')
          
      - name: Audit scripts
        shell: python
        run: |
          import re, pathlib
          files=sorted(pathlib.Path('.').glob('OOTB_*.md'))
          official={'體能','身法','巧手','隱密','儒學','道學','佛學','信仰','歷史政治','天文地理','格物推理','醫毒藥理','識字','書畫','棋藝','馴獸','洞察','生存','感應','說服','欺瞞','威嚇','表演','奏樂','騎術'}
          known_bad=['文書','調查','追蹤','追跡','察覺','觀察','交涉','醫毒','醫藥','格物','機關','工藝','工程','鍛造','木工','石工','手藝','帳務','航海','航運','水路','軍旅','礦物','農務','刀具']
          out=[]
          for p in files:
            t=p.read_text(encoding='utf-8'); ls=t.splitlines(); issues=[]
            for req in ['script_id','劇本版本','replay_policy','連續性']:
              if req not in t: issues.append('missing:'+req)
            for k,pat in {
              'old-reputation-number':r'(?:名望|聲譽|口碑|勢力關係|地方聲望|商旅評價|黑市名聲|官聲)\s*[+＋\-－]\s*\d',
              'direct-fame-number':r'名氣\s*[+＋\-－]\s*\d','negative-xia-e':r'(?:俠名|惡名)\s*[\-－]\s*\d','stale-filename-prefix':r'OOTB_劇本_'}.items():
              for i,line in enumerate(ls,1):
                if re.search(pat,line): issues.append(f'{k}@L{i}: {line.strip()}')
            for name in known_bad:
              for i,line in enumerate(ls,1):
                if re.search(rf'(?<![\w】）]){re.escape(name)}\s*(?:DC\s*\d+|檢定|判定|對抗)',line): issues.append(f'fake-skill:{name}@L{i}: {line.strip()}')
            # Flag residual slash/DC phrases that contain nonformal profession-style terms.
            for i,line in enumerate(ls,1):
              if 'DC' in line and re.search(r'(工藝|工程|鍛造|木工|石工|手藝|帳務|航海|航運|水路|軍旅|礦物|農務|刀具|外功|武學)／|／(工藝|工程|鍛造|木工|石工|手藝|帳務|航海|航運|水路|軍旅|礦物|農務|刀具|外功|武學)',line):
                issues.append(f'nonformal-slash@L{i}: {line.strip()}')
            settlements=[(i,re.search(r'\*\*社會名譽結算\*\*：([^\n]+)',line).group(1).strip()) for i,line in enumerate(ls,1) if re.search(r'\*\*社會名譽結算\*\*：([^\n]+)',line)]
            if len(settlements)>=2 and len({x[1] for x in settlements})==1 and any(v not in settlements[0][1] for v in []): pass
            if issues: out.append((str(p),issues))
          lines=['# Temporary OOTB static audit','',f'Total scripts: {len(files)}',f'Flagged scripts: {len(out)}','']
          for p,iss in out:
            lines.append('## '+p); lines += ['- '+x for x in iss]
          pathlib.Path('AUDIT_TMP.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
      - name: Commit repairs and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'OOTB_*.md' AUDIT_TMP.md
          if ! git diff --cached --quiet; then
            git commit -m 'Migrate scripts to current metadata and skill rules'
            git push
          fi
