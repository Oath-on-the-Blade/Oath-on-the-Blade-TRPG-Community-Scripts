name: Temporary OOTB quality audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit scripts
        shell: python
        run: |
          import re, pathlib, hashlib
          files=sorted(pathlib.Path('.').glob('OOTB_*.md'))
          fake=['文書','調查','追蹤','察覺','交涉','醫毒','格物','繩結經驗','帳房','查帳','刑名','鑑寶','搜查','觀察','審訊','談判','水性','航海','船藝','機關','鍛造','木工','採藥','讀唇','偵查','踩點','烹飪']
          out=[]
          for p in files:
            t=p.read_text(encoding='utf-8')
            ls=t.splitlines()
            issues=[]
            for req in ['script_id','劇本版本','replay_policy','連續性']:
              if req not in t: issues.append('missing:'+req)
            pats={
              'old-reputation-number':r'(?:名望|聲譽|口碑|勢力關係|地方聲望|商旅評價|黑市名聲|官聲)\s*[+＋\-－]\s*\d',
              'direct-fame-number':r'名氣\s*[+＋\-－]\s*\d',
              'negative-xia-e':r'(?:俠名|惡名)\s*[\-－]\s*\d',
              'stale-filename-prefix':r'OOTB_劇本_',
            }
            for k,pat in pats.items():
              for i,line in enumerate(ls,1):
                if re.search(pat,line): issues.append(f'{k}@L{i}: {line.strip()}')
            for name in fake:
              pat=rf'(?<![\w】]){re.escape(name)}\s*(?:DC\s*\d+|檢定|判定|對抗)'
              for i,line in enumerate(ls,1):
                if re.search(pat,line): issues.append(f'fake-skill:{name}@L{i}: {line.strip()}')
            settlements=[]
            for i,line in enumerate(ls,1):
              m=re.search(r'\*\*社會名譽結算\*\*：([^\n]+)',line)
              if m: settlements.append((i,m.group(1).strip()))
            if len(settlements)>=2 and len({x[1] for x in settlements})==1:
              issues.append(f'identical-reputation-all-endings:{len(settlements)} => {settlements[0][1]}')
            bad_terms=['作證','共犯','受賄','收買','滅口','偽造','私吞','放棄','失敗','見血','血案','屠','殺','惡','黑吃黑','助紂','替假','串供','背叛','人亡','全毀']
            for i,line in enumerate(ls):
              if re.match(r'^#{2,4}\s*(?:結局|END)',line) and any(x in line for x in bad_terms):
                window='\n'.join(ls[i:i+14])
                m=re.search(r'社會名譽結算.*',window)
                if m and re.search(r'俠名 \+[0-9.]+x E',m.group(0)) and '俠名 +0.0x E' not in m.group(0) and '惡名 +0.0x E' in m.group(0):
                  issues.append(f'suspicious-bad-ending-positive-xia@L{i+1}: {line.strip()} || {m.group(0)}')
            # Flag general files missing explicit task abandonment settlement wording.
            if '任務放棄' not in t and '放棄任務' not in t:
              issues.append('missing-explicit-abandonment-section')
            if issues: out.append((str(p),issues))
          lines=['# Temporary OOTB static audit','',f'Total scripts: {len(files)}',f'Flagged scripts: {len(out)}','']
          for p,iss in out:
            lines.append('## '+p)
            lines += ['- '+x for x in iss]
          pathlib.Path('AUDIT_TMP.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDIT_TMP.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh temporary quality audit report'
            git push
          fi
