name: Finalize 四坊封門前 v3
on:
  push:
    paths:
      - '.github/workflows/finalize-sifang-v3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final corrections safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('OOTB_任務_四坊封門前.md')
          s = p.read_text()
          for a,b in {
            '遊玩規則/00_遊戲核心.md':'遊玩規則/核心/遊戲核心.md',
            '遊玩規則/02_拿手與非戰鬥.md':'遊玩規則/核心/拿手與非戰鬥.md',
            '遊玩規則/03_戰鬥.md':'遊玩規則/遊玩流程/戰鬥.md',
            '遊玩規則/08_輕功.md':'遊玩規則/系統與機制/輕功.md',
          }.items():
              s = s.replace(a,b)
          # Make END-03 / END-04 propagation lines deterministic: keep the stated fixed multiplier only.
          lines = s.splitlines()
          section = ''
          out = []
          for line in lines:
              if line.startswith('## `END-03`'): section = '03'
              elif line.startswith('## `END-04`'): section = '04'
              elif line.startswith('## `END-05`'): section = '05'
              if section in {'03','04'} and line.startswith('- **傳播／成立理由**：') and '；若' in line:
                  line = line.split('；若',1)[0] + '。'
              out.append(line)
          s = '\n'.join(out) + '\n'
          p.write_text(s)
      - name: Commit and remove temporary workflows
        run: |
          git config user.name "OOTB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add OOTB_任務_四坊封門前.md
          git rm -f .github/workflows/fix-sifang-final.yml .github/workflows/finalize-sifang-v2.yml .github/workflows/finalize-sifang-v3.yml
          git commit -m "Finalize 四坊封門前 against current handbook"
          git push
