name: Fix low-level round

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-low-level-round.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase B fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, reps):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in reps:
                  if old not in s:
                      raise SystemExit(f'MISSING in {path}: {old[:80]}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          patch('OOTB_任務_水磨停在午飯前.md', [
            ('感應 DC 10 可在水聲中定位最安全喊話方向。','直覺（感應）DC 10 可在水聲中定位最安全喊話方向。'),
            ('高惡名角色直接威逼時，他會先藏銀袋並叫護貨腳夫靠近。','高惡名角色直接威逼時，他會先藏銀袋並叫護貨腳夫靠近；若角色名氣很高且未隱藏身份，他也更容易提前認出來者，會先把私藏木料再往柴棚深處移，留下新的拖痕作替代線索。'),
            ('- **銀兩／物質結果**：40 兩酬金實際取得，為全隊共同可分割財產；漂木、閘匙與磨坊工具均未取得。','- **銀兩／物質結果**：40 兩酬金實際取得，為全隊共同、可分割財產；由里正當場交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管。漂木、閘匙與磨坊工具均未取得。'),
            ('- **銀兩／物質結果**：30 兩酬金實際取得，為全隊共同可分割財產。\n- **基礎歷練**：行旅 2、江湖 1（總計 3）。','- **銀兩／物質結果**：30 兩酬金實際取得，為全隊共同、可分割財產；由里正交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管。\n- **基礎歷練**：行旅 2、江湖 1（總計 3）。\n- **角色參與條件**：實際參與救援或止險並在危機解除前未退出；只作一次短時協助者取得行旅 1。'),
            ('- **銀兩／物質結果**：15 兩查驗酬金實際取得；其餘未取得。\n- **基礎歷練**：計略 2、江湖 1（總計 3）。','- **銀兩／物質結果**：15 兩查驗酬金實際取得，為全隊共同、可分割財產；由里正交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管；其餘酬金未取得。\n- **基礎歷練**：計略 2、江湖 1（總計 3）。\n- **角色參與條件**：實際參與查證或控制責任證據；只參與一次短時對質者取得計略 1。'),
            ('- **銀兩／物質結果**：主要酬金未取得；已完成並由里正确認的單一核心工作最多 10 兩應收未收。','- **銀兩／物質結果**：主要酬金未取得；已完成並由里正确認的單一核心工作最多 10 兩為應收未收，權利屬實際完成該工作的玩家角色；款項尚由里正保管，日後領取後才成為可分配財產。'),
          ])

          patch('OOTB_任務_驛馬拖著半截韁繩.md', [
            ('感應 DC 11 可在風聲中聽出蘆灘深處短促咳嗽；','直覺（感應）DC 11 可在風聲中聽出蘆灘深處短促咳嗽；'),
            ('高惡名角色威逼時，他可能相信角色想黑吃黑，反而試圖交錢求放過。','高惡名角色威逼時，他可能相信角色想黑吃黑，反而試圖交錢求放過；若角色名氣很高且公開身份，他會更早得知有名人物介入，提前改走蘆灘側面搜索，留下新的三人腳印作替代追蹤線索。'),
            ('- **銀兩／物質結果**：45 兩酬金實際取得，屬全隊共同可分割財產；官袋與木牌交回官府／驛站，玩家未取得。','- **銀兩／物質結果**：45 兩酬金實際取得，屬全隊共同、可分割財產；由驛正當場交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管。官袋與木牌交回官府／驛站，玩家未取得。'),
            ('- **銀兩／物質結果**：30 兩酬金實際取得。\n- **基礎歷練**：行旅 2、江湖 1（總計 3）。','- **銀兩／物質結果**：30 兩酬金實際取得，屬全隊共同、可分割財產；由驛正交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管。\n- **基礎歷練**：行旅 2、江湖 1（總計 3）。\n- **角色參與條件**：實際參與追蹤或救援並在驛卒安全前未退出；只作一次短時接應者取得行旅 1。'),
            ('- **銀兩／物質結果**：15 兩查驗酬金實際取得。\n- **基礎歷練**：計略 2、行旅 1（總計 3）。','- **銀兩／物質結果**：15 兩查驗酬金實際取得，屬全隊共同、可分割財產；由驛正交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管。\n- **基礎歷練**：計略 2、行旅 1（總計 3）。\n- **角色參與條件**：實際參與固定勒索證據或尋找驛卒；只參與一次短時對質者取得計略 1。'),
            ('- **銀兩／物質結果**：主要酬金未取得；已交回官袋或可用證物者最多 10 兩應收未收。','- **銀兩／物質結果**：主要酬金未取得；已交回官袋或可用證物者最多 10 兩為應收未收，權利屬實際完成交付的玩家角色；款項仍由平潮驛保管，日後領取後才可分配。'),
          ])

          patch('OOTB_任務_米行門口兩桿秤.md', [
            ('高惡名角色威逼時，他會懷疑對方想勒索。','高惡名角色威逼時，他會懷疑對方想勒索；若角色名氣很高且公開身份，店伙更容易從圍觀人口中得知名人介入，危機時鐘達 2 時便提前往河埠移動，但沿途會留下更急促的米糠車痕。'),
            ('- **銀兩／物質結果**：40 兩酬金實際取得，屬全隊共同可分割財產；秤、米袋與帳冊均未取得。','- **銀兩／物質結果**：40 兩酬金實際取得，屬全隊共同、可分割財產；由里正當場交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管。秤、米袋與帳冊均未取得。'),
            ('- **銀兩／物質結果**：30 兩酬金實際取得。\n- **基礎歷練**：江湖 2、計略 1（總計 3）。','- **銀兩／物質結果**：30 兩酬金實際取得，屬全隊共同、可分割財產；由里正交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管。\n- **基礎歷練**：江湖 2、計略 1（總計 3）。\n- **角色參與條件**：實際參與人群處理或查驗其中至少一類並在衝突平息前未退出；只作一次短時協助者取得江湖 1。'),
            ('- **銀兩／物質結果**：20 兩查驗酬金實際取得；其餘未取得。\n- **基礎歷練**：計略 2、江湖 1（總計 3）。','- **銀兩／物質結果**：20 兩查驗酬金實際取得，屬全隊共同、可分割財產；由里正交付，玩家於結算時決定分配，未達共識前由一名玩家角色暫管；其餘酬金未取得。\n- **基礎歷練**：計略 2、江湖 1（總計 3）。\n- **角色參與條件**：實際參與驗秤、查帳或河埠取證；只參與一次短時查驗者取得計略 1。'),
            ('- **銀兩／物質結果**：主要酬金未取得；若已向里正交付一項足以持續查辦的完整證據，最多 10 兩應收未收。','- **銀兩／物質結果**：主要酬金未取得；若已向里正交付一項足以持續查辦的完整證據，最多 10 兩為應收未收，權利屬實際完成交付的玩家角色；款項仍由里正保管，日後領取後才可分配。'),
          ])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OOTB_任務_水磨停在午飯前.md OOTB_任務_驛馬拖著半截韁繩.md OOTB_任務_米行門口兩桿秤.md
          git commit -m "fix: complete Phase B settlement details"
          git push
