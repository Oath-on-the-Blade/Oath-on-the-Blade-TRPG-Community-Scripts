name: Temporary Sifang ending id repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-sifang-ending-id-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stable ending ids
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('OOTB_任務_四坊封門前.md')
          t=p.read_text()
          if '- **劇本版本**：1.1' not in t: raise SystemExit('unexpected version')
          t=t.replace('- **劇本版本**：1.1','- **劇本版本**：1.2',1)
          ids={
            '## `END-01` 四坊未亂，真相留存':'`ootb-sifang-fengmen-qian-end-01`',
            '## `END-02` 人救下了，案卻未全明':'`ootb-sifang-fengmen-qian-end-02`',
            '## `END-03` 案破了，南市付出代價':'`ootb-sifang-fengmen-qian-end-03`',
            '## `END-04` 封門成了錯案':'`ootb-sifang-fengmen-qian-end-04`',
            '## `END-05` 離開南市':'`ootb-sifang-fengmen-qian-end-05`',
          }
          for h,eid in ids.items():
              if h not in t: raise SystemExit('missing '+h)
              t=t.replace(h,h+'\n\n- **ending_id**：'+eid,1)
          if t.count('**ending_id**') != 5: raise SystemExit('wrong ending id count')
          p.write_text(t)
          PY
      - name: Commit and clean
        run: |
          git config user.name "OOTB Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add OOTB_任務_四坊封門前.md
          git rm .github/workflows/temporary-sifang-ending-id-fix.yml
          git commit -m "Add stable ending ids to 四坊封門前"
          git push
