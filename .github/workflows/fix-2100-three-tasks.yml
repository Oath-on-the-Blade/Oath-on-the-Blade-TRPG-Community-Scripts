name: Temporary validation fixes for three tasks
on:
  push:
    paths:
      - '.github/workflows/fix-2100-three-tasks.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validation fixes
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:80]}')
              p.write_text(s.replace(old,new))

          g='OOTB_任務_百戲棚下無人鼓.md'
          rep(g, '| 基準總歷練 B | 7 |', '| 基準總歷練 B | 8 |')
          rep(g, '| 主要地區 | 江南道照水府南市；百戲大棚、後臺繩架、河埠貨倉、票房小樓 |', '| 主要地區 | 江南道一座河港市鎮「照水鎮」南市；百戲大棚、後臺繩架、河埠貨倉、票房小樓 |')
          rep(g, '| 地方資料 | 南市百戲棚為本任務新增地方場所，屬季節性商演場，不建立固定世界正典。 |', '| 地方資料 | 照水鎮與南市百戲棚均為本任務新增地方資料，只服務本任務局部世界真相，不宣告為 Handbook 固定地理正典。 |')
          rep(g, '| 結局歷練 | R=11、B=7；主要結局6–7點，詳見結局章。 |', '| 結局歷練 | R=11、T=4、S=2、B=8；主要完整結局7–8點，詳見結局章。 |')
          rep(g, '# 9. 結局與結算\n\n所有社會名譽以角色本次實得基礎總歷練E為尺度，先做等級折算，再做個人額外歷練加成。', '# 9. 結局與結算\n\n`E = 角色等級折算後、歷練型絕活／背景／其他個人額外歷練加成之前的實得基礎總歷練`。所有社會名譽倍率以 E 為尺度；下列未列為非零者亦明列為0。共同銀兩若未在桌內另有一致分配，結算時由全隊共同持有、可分割，分配權屬玩家共同決定；未達共識則由隊伍指定保管者暫管。')
          rep(g, '## END-01「棚在人散，證在人留」\n條件：', '## END-01「棚在人散，證在人留」\n- **角色卡顯示名稱**：棚在人散，證在人留\n- **結算類型**：完成結局\n條件：')
          rep(g, '- 基礎歷練：`救援3` + `查明2` + `保證1` + `收束1` = **7**', '- 基礎歷練：行旅3、計略3、江湖2（基礎總計 **8**）')
          rep(g, '- 銀兩：全隊240兩，實收；由班主與行會共同支付，可自由分配。\n- 社會名譽：俠名+0.6x；惡名+0.0x；【民間】+0.5x；【商賈】+0.3x；【官府】+0.2x。', '- 銀兩／物質：全隊240兩**實際取得**，支付後歸全隊共同所有、可分割；班主交付，玩家共同決定分配。證物交捕快後屬官面保管，不是玩家戰利品。\n- 社會名譽：俠名+0.6x E；惡名+0.0x E；【民間】+0.5x E；【商賈】+0.3x E；【官府】+0.2x E。傳播：觀眾與戲班公開見證救援形成俠名／民間評價；行會把停演損失與保棚結果傳入商賈圈；捕快收證與立案記錄形成官府評價。')
          rep(g, '## END-02「棚毀而人全」\n條件：', '## END-02「棚毀而人全」\n- **角色卡顯示名稱**：棚毀而人全\n- **結算類型**：完成結局\n條件：')
          rep(g, '- 基礎歷練：`救援3` + `查明2` + `收束1` = **6**\n- 銀兩：全隊200兩實收。\n- 社會名譽：俠名+0.4x；惡名+0.0x；【民間】+0.4x；【商賈】+0.1x；【官府】+0.2x。', '- 基礎歷練：行旅3、計略3、江湖1（基礎總計 **7**）\n- 角色參與：參與疏散／救援並參與查證或終局者得完整7點；只在坍塌後加入收尾者行旅1、江湖1（2）。\n- 銀兩／物質：全隊200兩**實際取得**，歸全隊共同所有、可分割，由玩家共同決定分配；損壞棚架由班主／場主承擔，不轉為玩家債務。\n- 社會名譽：俠名+0.4x E；惡名+0.0x E；【民間】+0.4x E；【商賈】+0.1x E；【官府】+0.2x E。傳播：大批觀眾見證人員安全撤離；行會知道棚毀但人命保住；捕快依交證記錄玩家協助追責。')
          rep(g, '## END-03「只救一頭」\n條件：', '## END-03「只救一頭」\n- **角色卡顯示名稱**：只救一頭\n- **結算類型**：失敗結局\n條件：')
          rep(g, '- 基礎歷練：按實際取得 `救援3` 或 `查明2`，另可有`收束1`，總計 **3–4**。\n- 銀兩：全隊120–160兩，依班主是否仍有支付能力。\n- 社會名譽：若救援成功，俠名+0.2x、【民間】+0.2x；若因延誤造成傷亡，以上為0且【民間】-0.2x。其餘0。', '- 基礎歷練：若完成主要救援，行旅3、江湖1（4）；若主要完成追責，計略3、江湖1（4）；兩邊皆只局部完成則按實際行旅／計略2、江湖1（3）。\n- 角色參與：只取得本人實際參與一側的上述組合；事後才加入者江湖1（1）。\n- 銀兩／物質：全隊120–160兩**實際取得**，以班主當下支付能力決定固定總額後交全隊共同所有、可分割，由玩家共同分配；未付部分不形成自動應收。\n- 社會名譽：救援成功且公開時俠名+0.2x E、惡名0、【民間】+0.2x E；若玩家明知危機仍延誤造成傷亡，俠名0、惡名0、【民間】-0.2x E；【商賈】0、【官府】0。傳播只來自在場觀眾與戲班對實際救援／延誤的見證。')
          rep(g, '## END-04「真相沉河」\n條件：', '## END-04「真相沉河」\n- **角色卡顯示名稱**：真相沉河\n- **結算類型**：失敗結局\n條件：')
          rep(g, '- 基礎歷練：已完成的救援tag照給；另`承受失敗1`，總計 **1–4**。\n- 銀兩：全隊80–140兩，僅按救援支付。\n- 社會名譽：依公開救援實績俠名0至+0.2x；無相對名譽自動變化。', '- 基礎歷練：完整救援者行旅3、江湖1（4）；只參與最後證據收束者計略1、江湖1（2）；更早退出者按實際行旅／計略1（1）。\n- 銀兩／物質：全隊80–140兩**實際取得**，只計已完成救援；確定總額後歸全隊共同所有、可分割，由玩家共同分配。已毀證物維持毀損，不生成替代財產。\n- 社會名譽：若有公開救援，俠名+0.2x E、惡名0、【民間】+0.2x E；否則俠名0、惡名0、【民間】0；【商賈】0、【官府】0。傳播僅由被救觀眾與戲班形成，不因秘密查案自動增加名譽。')
          rep(g, '## END-05「鼓停棚落」\n條件：', '## END-05「鼓停棚落」\n- **角色卡顯示名稱**：鼓停棚落\n- **結算類型**：任務放棄\n條件：')
          rep(g, '- 基礎歷練：若曾實際救人可得`局部救援1–2`；否則0。\n- 銀兩：0–60兩，只結算已明確完成的個別救援承諾。\n- 社會名譽：單純離場且無公開責任為0；若玩家公開承諾救援後臨陣離開並被大量觀眾見證，【民間】-0.2x。若玩家主動製造踩踏或殺害投降者，惡名+0.3x至+0.6x，由具體公開行為取較高一項，不疊加。', '- 基礎歷練：實際完成局部救援者行旅1–2（基礎總計1–2）；未實質介入者0。\n- 角色參與：只按本人在離場前完成的行旅內容結算；事後返回不補發未經歷內容。\n- 銀兩／物質：0–60兩；只有已明確完成的個別救援承諾為**實際取得**，付款後屬獲得者；其餘報酬未取得。\n- 社會名譽：一般離場俠名0、惡名0、【民間】0、【商賈】0、【官府】0。若公開承諾救援後臨陣離開且被大量觀眾見證，【民間】-0.2x E；若公開主動製造踩踏或殺害投降者，惡名依實際可傳播行為取+0.3x E至+0.6x E的一項，不疊加。傳播由在場觀眾、戲班與後續傷者口述形成。')
          rep(g, '## 玩家不介入時\n\n<NPC#2>最後會在第3格自行喊停，但太遲。西南棚頂局部坍落，造成多人重傷；<NPC#3>攜帳離開，<NPC#4>被棄在貨倉。班主把責任全推給棚架匠，真正勒索計畫要數日後才可能浮現。', '## 玩家不介入時\n\n<NPC#2>最後會在第3格自行喊停，但太遲。西南棚頂局部坍落，造成多人重傷；<NPC#3>攜帳離開，<NPC#4>被棄在貨倉。班主把責任全推給棚架匠，真正勒索計畫要數日後才可能浮現。\n\n## 最壞合理世界狀態\n\n若玩家既未疏散又在追逐中引發更大混亂，西南棚頂坍落並出現踩踏；<NPC#4>受困重傷、<NPC#3>逃走且帳頁入河。此狀態仍保留主索切口、鼓腔塞紙與票房頁根作最後有限來源；若玩家再把這些全部不可逆毀損，依第8節啟動最後收束，不再生成新證據。')
          rep(g, '- 玩家提前抓<NPC#3>：', '- 玩家提前猜中<NPC#3>是策劃者：可以直接對質、拘留或查帳；猜中不自動產生證據，棚架危機仍照推。\n- 玩家提前抓<NPC#3>：')

          f='OOTB_任務_千機峽外兩道弩痕.md'
          rep(f, '# 9. 結局與結算\n\n社會名譽以每名角色本次實得基礎總歷練E為尺度。', '# 9. 結局與結算\n\n`E = 角色等級折算後、歷練型絕活／背景／其他個人額外歷練加成之前的實得基礎總歷練`。共同銀兩若未另有一致分配，支付後由全隊共同持有、可分割，玩家共同決定分配；未達共識則由隊伍指定保管者暫管。三架弩始終是事故證物／天機閣報廢器械，不因任何結局變成玩家財產。')
          rep(f, '## 3.3 玩家不介入\n\n<NPC#1>會帶人強收第二架，引發與驛戶衝突；<NPC#3>趁亂燒掉私售收據；<NPC#5>離開；第三架在試索坡走火。天機閣最後仍能查出器械被偷，但地方會先相信「天機機關傷人後搶證」。', '## 3.3 玩家不介入\n\n<NPC#1>會帶人強收第二架，引發與驛戶衝突；<NPC#3>趁亂燒掉私售收據；<NPC#5>離開；第三架在試索坡走火。天機閣最後仍能查出器械被偷，但地方會先相信「天機機關傷人後搶證」。\n\n## 3.4 最壞合理世界狀態\n\n第三架在驛隊前走火，引發馱馬驚群與墜坡；責器亭又因強收器械與驛戶械鬥。<NPC#3>燒掉收據、<NPC#5>帶草圖離開。此時仍至少有報廢抄錄、原機／後改結構差異及第一架無警示現場可供最後收束；若這些亦被不可逆毀損，按第8節進END-04。')
          rep(f, '## END-01「器歸其責」\n條件：', '## END-01「器歸其責」\n- **角色卡顯示名稱**：器歸其責\n- **結算類型**：完成結局\n條件：')
          rep(f, '- 基礎歷練：`排危2` + `查明2` + `護證1` + `收束1` = **6**', '- 基礎歷練：計略3、行旅2、江湖1（基礎總計 **6**）')
          rep(f, '- 銀兩：全隊210兩實收，可自由分配。\n- 社會名譽：俠名+0.5x；惡名+0.0x；【天機閣】+0.5x；【民間】+0.4x；【商賈】+0.1x。', '- 銀兩／物質：全隊210兩**實際取得**，歸全隊共同所有、可分割，由玩家共同分配；三架弩留置責器亭／追責程序保管，玩家無所有權。\n- 社會名譽：俠名+0.5x E；惡名0；【天機閣】+0.5x E；【民間】+0.4x E；【商賈】+0.1x E。傳播：天機門人把角色拒絕滅證且排危的事蹟回報山門；傷者與驛戶傳播民間評價；合法商戶知道玩家既追責又沒有藉機搶貨，形成較小商賈正評。')
          rep(f, '## END-02「先止弩，再追帳」\n條件：', '## END-02「先止弩，再追帳」\n- **角色卡顯示名稱**：先止弩，再追帳\n- **結算類型**：完成結局\n條件：')
          rep(f, '- 基礎歷練：`排危2` + `部分查明2` + `收束1` = **5**\n- 銀兩：全隊170兩實收。\n- 社會名譽：俠名+0.4x；【天機閣】+0.2x；【民間】+0.3x；【商賈】0。', '- 基礎歷練：行旅2、計略2、江湖1（基礎總計 **5**）\n- 角色參與：參與排危並參與查證／收束者得完整5點；只在第三架排除後加入者計略1、江湖1（2）。\n- 銀兩／物質：全隊170兩**實際取得**，共同所有、可分割，由玩家共同分配；事故弩留置追責，不可分配。\n- 社會名譽：俠名+0.4x E；惡名0；【天機閣】+0.2x E；【民間】+0.3x E；【商賈】0。傳播：驛隊與傷者見證排危；天機門人知道玩家保住證物但案情未全結，故門派正評較低；商賈圈未形成一致責任判斷。')
          rep(f, '## END-03「只護一方」\n條件：', '## END-03「只護一方」\n- **角色卡顯示名稱**：只護一方\n- **結算類型**：失敗結局\n條件：')
          rep(f, '- 基礎歷練：按實際`局部排危2`或`局部查明2`，加`承受後果1`，總計 **2–3**。\n- 銀兩：80–120兩。\n- 社會名譽：若偏袒門派滅證，【天機閣】+0.1x但【民間】-0.3x、俠名0；若故意毀掉門派證物替商方卸責，【商賈】+0.1x但【天機閣】-0.3x。沒有引薦。', '- 基礎歷練：局部排危者行旅2、江湖1（3）；主要做局部查明者計略2、江湖1（3）；更早退出者只取實際行旅／計略1–2。\n- 角色參與：只按本人實際經歷的上述正式tag結算。\n- 銀兩／物質：80–120兩**實際取得**，由實際受益一方支付；確定總額後歸全隊共同所有、可分割，玩家共同分配；弩仍非玩家財產。\n- 社會名譽：偏袒門派滅證時俠名0、惡名0、【天機閣】+0.1x E、【民間】-0.3x E、【商賈】0；故意毀門派證物替商方卸責時俠名0、惡名0、【商賈】+0.1x E、【天機閣】-0.3x E、【民間】0。傳播由受傷者／驛戶看見證據被壓下，或由商方與天機門人各自知道玩家選邊而形成；秘密未曝光的偏袒不產生全江湖俠名／惡名。沒有引薦。')
          rep(f, '## END-04「三架無主」\n條件：', '## END-04「三架無主」\n- **角色卡顯示名稱**：三架無主\n- **結算類型**：失敗結局\n條件：')
          rep(f, '- 基礎歷練：已完成排危tag照給，另`承受失敗1`，總計 **1–3**。\n- 銀兩：60–100兩，只按救援／排危支付。\n- 社會名譽：若公開安全排危成功，俠名+0.2x、【民間】+0.2x；其餘0。無引薦。', '- 基礎歷練：完成第三架排危者行旅2、江湖1（3）；只參與證據最後收束者計略1、江湖1（2）；更早退出者1點。\n- 銀兩／物質：60–100兩**實際取得**，只按排危／救援支付；總額確定後共同所有、可分割，由玩家共同分配。失去的器械／文書維持失落或毀損。\n- 社會名譽：公開排危成功時俠名+0.2x E、惡名0、【民間】+0.2x E；【天機閣】0、【商賈】0；沒有公開排危時上述全0。傳播僅由驛戶與被保護者見證形成。無引薦。')
          rep(f, '## END-05「弩響驛驚」\n條件：', '## END-05「弩響驛驚」\n- **角色卡顯示名稱**：弩響驛驚\n- **結算類型**：任務放棄\n條件：')
